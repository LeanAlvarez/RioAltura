name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff + pytest (backend, worker, scripts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rioaltura
          POSTGRES_PASSWORD: rioaltura
          POSTGRES_DB: rioaltura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rioaltura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests marcados con TEST_DATABASE_URL corren contra este Postgres real.
      TEST_DATABASE_URL: postgresql+psycopg://rioaltura:rioaltura@localhost:5432/rioaltura
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: pnpm build + test (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads package.json from the repo root by default;
          # ours lives in frontend/ (working-directory does not apply to actions).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
