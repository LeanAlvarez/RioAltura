[project]
name = "backend"
version = "0.1.0"
description = "API FastAPI: lee de Postgres y de capas estáticas, nunca llama a APIs externas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
