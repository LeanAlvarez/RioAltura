[project]
name = "rioaltura-geoprocessing"
version = "0.1.0"
description = "Offline flood-layer generation for the Río Uruguay en Colón map (Copernicus DEM)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "affine>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
