# Configuración de Alembic. Los scripts viven en backend/alembic/.
# Uso desde la raíz: uv run alembic upgrade head
[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = %(here)s/backend
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# La URL real la resuelve backend/alembic/env.py desde las variables de entorno.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
