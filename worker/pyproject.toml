[project]
name = "worker"
version = "0.1.0"
description = "Jobs periódicos: pronósticos de Google, alturas del INA/Prefectura, avisos y alertas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "backend",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pdfplumber>=0.11,<0.12",
]

[tool.uv.sources]
backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs"]
